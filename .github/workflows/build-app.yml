name: Build app (fork)

on:
  workflow_dispatch:
  push:
    branches: [fix/ime-auto-suggest]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 27 on this runner"; exit 1; fi
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build
        run: |
          xcodegen generate
          xcodebuild -project Ghostwriter.xcodeproj -scheme Ghostwriter -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual OTHER_CODE_SIGN_FLAGS= build

      - name: Package
        run: |
          APP=build/Build/Products/Release/Ghostwriter.app
          codesign --force --deep --options runtime \
            --entitlements Ghostwriter/Ghostwriter.entitlements -s - "$APP"
          codesign -dv "$APP"
          ditto -c -k --keepParent "$APP" Ghostwriter.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Ghostwriter-app
          path: Ghostwriter.zip
          retention-days: 7
